name: ToddlerGames
options:
  bundleIdPrefix: com.bimiboo
  deploymentTarget:
    iOS: "15.0"
targets:
  ToddlerGames:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: ToddlerGames
    info:
      path: ToddlerGames/Info.plist
      properties:
        UILaunchStoryboardName: LaunchScreen
        UIRequiresFullScreen: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.bimiboo.toddlergames
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      SWIFT_VERSION: "5.0"
      INFOPLIST_KEY_UILaunchStoryboardName: "LaunchScreen"
      INFOPLIST_KEY_UIRequiresFullScreen: "YES"
      CODE_SIGNING_ALLOWED: "NO"
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGN_IDENTITY: ""
